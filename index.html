<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bio</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Space Grotesk", sans-serif;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at top, #0a0a0a, #000000);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Background glow */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(140, 0, 255, 0.25), transparent 70%);
      filter: blur(100px);
      animation: pulse 6s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 0.6; }
      to { transform: scale(1.3); opacity: 1; }
    }

    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      width: 320px;
      box-shadow: 0 0 30px rgba(140, 0, 255, 0.2);
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-bottom: 15px;
      border: 2px solid rgba(140, 0, 255, 0.7);
      box-shadow: 0 0 15px rgba(140, 0, 255, 0.6);
      object-fit: cover;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 5px;
    }

    .tagline {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 25px;
    }

    .links a {
      display: block;
      text-decoration: none;
      color: white;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      transition: 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .links a:hover {
      background: linear-gradient(90deg, #8c00ff, #3a8dff);
      box-shadow: 0 0 15px rgba(140, 0, 255, 0.7);
      transform: translateY(-2px);
    }

    .music {
      margin-top: 20px;
      font-size: 13px;
      opacity: 0.6;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <img class="avatar" src="https://i.pravatar.cc/150" alt="avatar" />
    <h1>@username</h1>
    <div class="tagline">digital ghost in the system</div>

    <div class="links">
      <a href="#">Discord</a>
      <a href="#">Telegram</a>
      <a href="#">Instagram</a>
      <a href="#">TikTok</a>
    </div>

    <div class="music" onclick="toggleMusic()">Toggle music</div>
  </div>

  <audio id="bgMusic" loop>
    <source src="https://files.catbox.moe/4f7q6v.mp3" type="audio/mpeg">
  </audio>

  <script>
    const music = document.getElementById("bgMusic");
    let playing = false;

    function toggleMusic() {
      if (playing) {
        music.pause();
      } else {
        music.play();
      }
      playing = !playing;
    }
  </script>

</body>
</html>
